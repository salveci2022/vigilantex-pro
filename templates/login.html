<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VIGILANTEX PRO — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#04070f;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,136,221,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,136,221,.03) 1px,transparent 1px);background-size:55px 55px;pointer-events:none;}
.box{width:100%;max-width:420px;background:#070d1a;border:1px solid #162540;padding:2.2rem 1.8rem;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px));box-shadow:0 0 60px rgba(0,85,153,.15);position:relative;z-index:1;}
.logo{text-align:center;margin-bottom:2rem;}
.logo svg{width:60px;height:60px;filter:drop-shadow(0 0 18px rgba(0,136,221,.7));}
.logo h1{font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:900;color:#deeaf5;letter-spacing:3px;margin-top:.7rem;}
.logo h1 span{color:#0088dd;}
.logo p{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:#4a6070;letter-spacing:3px;margin-top:.3rem;}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1.4rem;}
.role-btn{background:transparent;border:1px solid #162540;color:#4a6070;padding:9px 4px;font-family:'Share Tech Mono',monospace;font-size:.58rem;letter-spacing:1px;cursor:pointer;transition:all .2s;text-align:center;}
.role-btn .ri{display:block;font-size:1.3rem;margin-bottom:3px;}
.role-btn.sel,.role-btn:hover{border-color:#0088dd;color:#0088dd;background:rgba(0,136,221,.07);}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:1rem;}
label{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:#0088dd;letter-spacing:2px;text-transform:uppercase;}
input{background:rgba(0,0,0,.5);border:1px solid #162540;color:#deeaf5;padding:10px 12px;font-family:'Rajdhani',sans-serif;font-size:.95rem;font-weight:600;outline:none;transition:border-color .2s;width:100%;}
input:focus{border-color:#0088dd;}
.btn{width:100%;background:linear-gradient(135deg,#005599,#0088dd);color:#fff;border:none;padding:13px;font-family:'Orbitron',monospace;font-size:.78rem;font-weight:700;letter-spacing:3px;cursor:pointer;transition:all .3s;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);margin-top:.3rem;}
.btn:hover{box-shadow:0 0 25px rgba(0,136,221,.5);}
.erro{background:rgba(255,34,68,.1);border:1px solid rgba(255,34,68,.3);color:#ff2244;padding:10px 12px;font-family:'Share Tech Mono',monospace;font-size:.68rem;letter-spacing:1px;margin-bottom:1rem;display:none;}
.loading{text-align:center;font-family:'Share Tech Mono',monospace;font-size:.68rem;color:#0088dd;letter-spacing:2px;margin-top:.8rem;display:none;}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <svg viewBox="0 0 60 68">
      <path d="M30 3L57 16L57 41C57 55 30 65 30 65C30 65 3 55 3 41L3 16Z" fill="none" stroke="#b8ccd8" stroke-width="1.5"/>
      <path d="M30 10L51 21L51 40C51 53 30 62 30 62C30 62 9 53 9 40L9 21Z" fill="rgba(0,85,153,.1)" stroke="#005599" stroke-width=".8"/>
      <path d="M19 17L30 51L41 17" fill="none" stroke="#b8ccd8" stroke-width="3" stroke-linecap="round"/>
      <line x1="35" y1="17" x2="30" y2="51" stroke="#0088dd" stroke-width="2"/>
      <circle cx="30" cy="35" r="3" fill="#0088dd"/>
    </svg>
    <h1>VIGILANTEX<span> PRO</span></h1>
    <p>Sistema de Gestão de Plantão · v2026</p>
  </div>

  <div class="role-grid">
    <button class="role-btn sel" onclick="setRole(this,'vigilante')"><span class="ri">👮</span>VIGILANTE</button>
    <button class="role-btn" onclick="setRole(this,'supervisor')"><span class="ri">🧑‍💼</span>SUPERVISOR</button>
    <button class="role-btn" onclick="setRole(this,'gestor')"><span class="ri">🏢</span>GESTOR</button>
  </div>

  <div id="erro" class="erro"></div>

  <div class="fg">
    <label>// Email</label>
    <input id="email" type="email" placeholder="seu@email.com" autocomplete="email">
  </div>
  <div class="fg">
    <label>// Senha</label>
    <input id="senha" type="password" placeholder="••••••••" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')entrar()">
  </div>

  <button class="btn" onclick="entrar()">[ ENTRAR NO SISTEMA ]</button>
  <div id="loading" class="loading">AUTENTICANDO...</div>
</div>

<script>
let roleAtual = 'vigilante';

function setRole(btn, r) {
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  roleAtual = r;
}

async function entrar() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const erroEl = document.getElementById('erro');
  const loadEl = document.getElementById('loading');

  if (!email || !senha) {
    erroEl.textContent = 'Preencha email e senha';
    erroEl.style.display = 'block';
    return;
  }

  erroEl.style.display = 'none';
  loadEl.style.display = 'block';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });
    const data = await res.json();

    if (data.ok) {
      window.location.href = '/painel';
    } else {
      erroEl.textContent = data.erro || 'Erro ao entrar';
      erroEl.style.display = 'block';
      loadEl.style.display = 'none';
    }
  } catch (e) {
    erroEl.textContent = 'Erro de conexão. Tente novamente.';
    erroEl.style.display = 'block';
    loadEl.style.display = 'none';
  }
}
</script>
</body>
</html>
